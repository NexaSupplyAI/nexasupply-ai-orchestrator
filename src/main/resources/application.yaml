server:
  port: 8085

spring:
  application:
    name: ai-orchestrator
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    internal-jwt:
      enabled: ${INTERNAL_JWT_ENABLED:false}
      secret: ${INTERNAL_JWT_SECRET:}
      issuer: ${INTERNAL_JWT_ISSUER:nexasupply-portal}
      audience: ${INTERNAL_JWT_AUDIENCE:nexasupply-internal-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

clients:
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8082}
  supplier-service:
    base-url: ${SUPPLIER_SERVICE_URL:http://localhost:8083}
  reporting-service:
    base-url: ${REPORTING_SERVICE_URL:http://localhost:8084}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:3s}
    read-timeout: ${HTTP_READ_TIMEOUT:10s}
  authentication:
    mode: ${INTER_SERVICE_AUTH_MODE:propagate}
    scope: ${AZURE_INTER_SERVICE_SCOPE:}

foundry:
  enabled: ${FOUNDRY_ENABLED:false}
  project-endpoint: ${FOUNDRY_PROJECT_ENDPOINT:}
  model: ${FOUNDRY_MODEL:}
  token-scope: ${FOUNDRY_TOKEN_SCOPE:https://cognitiveservices.azure.com/.default}
  max-tool-rounds: ${FOUNDRY_MAX_TOOL_ROUNDS:3}
  max-output-tokens: ${FOUNDRY_MAX_OUTPUT_TOKENS:800}
  max-history-messages: ${FOUNDRY_MAX_HISTORY_MESSAGES:12}
  max-history-characters: ${FOUNDRY_MAX_HISTORY_CHARACTERS:24000}
  connect-timeout: ${FOUNDRY_CONNECT_TIMEOUT:5s}
  read-timeout: ${FOUNDRY_READ_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
