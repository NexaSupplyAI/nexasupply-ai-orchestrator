server:
  port: 8085

spring:
  application:
    name: ai-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexasupplyai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ai
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9999}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9999/.well-known/jwks.json}

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

clients:
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8082}
  supplier-service:
    base-url: ${SUPPLIER_SERVICE_URL:http://localhost:8083}
  reporting-service:
    base-url: ${REPORTING_SERVICE_URL:http://localhost:8084}

foundry:
  enabled: ${FOUNDRY_ENABLED:false}
  project-endpoint: ${FOUNDRY_PROJECT_ENDPOINT:}
  model: ${FOUNDRY_MODEL:gpt-5-mini}
  max-tool-rounds: ${FOUNDRY_MAX_TOOL_ROUNDS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
